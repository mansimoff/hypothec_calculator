name: Deploy to GitHub Pages

# Срабатывает после завершения CI в ветке main.
# Деплой выполняется ТОЛЬКО если CI завершился успешно — сломанная версия не уедет.
on:
  workflow_run:
    workflows: [CI] # точное значение поля name в ci.yml
    types: [completed]
    branches: [main]

# Права, необходимые actions/deploy-pages для публикации
permissions:
  contents: read
  pages: write
  id-token: write

# Один деплой за раз: новый запуск отменяет незавершённый предыдущий
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: publish src/ to Pages
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Деплоим ровно тот коммит, который проверил CI
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/configure-pages@v5

      # Публикуем содержимое src/ — это корень сайта (index.html лежит там)
      - uses: actions/upload-pages-artifact@v3
        with:
          path: src

      - id: deployment
        uses: actions/deploy-pages@v4
