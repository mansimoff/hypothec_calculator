name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: lint + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Unit, golden and UI smoke tests
        run: npm test

  golden:
    name: golden data is reproducible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate golden.json with the independent Python oracle
        run: python3 scripts/gen_golden.py

      - name: Fail if golden.json drifted
        run: git diff --exit-code tests/golden/golden.json
